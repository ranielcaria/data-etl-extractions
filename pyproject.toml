#:schema https://json.schemastore.org/pyproject.json

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-etl-extractions"
version = "0.1.0"
description = "Extraction for .xls/.xlsx reports"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "xlrd",
    "openpyxl",
    "psycopg2-binary"
]

[tool.setuptools]
packages = ["api", "main"]